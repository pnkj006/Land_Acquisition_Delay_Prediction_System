version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db}
      POSTGRES_DB: ${POSTGRES_DB:-land_acquisition_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host 5433 avoids clashing with a local Postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-db} -d $${POSTGRES_DB:-land_acquisition_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build: ./ML_work
    restart: unless-stopped
    environment:
      X_INTERNAL_TOKEN: ${X_INTERNAL_TOKEN:?Set X_INTERNAL_TOKEN in .env}
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # Note: uses "db:5432" internally within the docker network, not 5433
      DATABASE_URL: postgresql://${POSTGRES_USER:-db}:${POSTGRES_PASSWORD:-db}@db:5432/${POSTGRES_DB:-land_acquisition_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      X_INTERNAL_TOKEN: ${X_INTERNAL_TOKEN:?Set X_INTERNAL_TOKEN in .env}
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
